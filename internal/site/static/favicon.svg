<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Barry Prendergast">
  <title>Barry Prendergast</title>
  <!-- Terminal prompt: the same chevron-and-cursor idea the site's hero uses.
       Deliberately one fixed palette rather than a prefers-color-scheme swap —
       the dark tile reads on both light and dark browser chrome, and favicon
       theme switching is inconsistently supported. -->
  <rect width="32" height="32" rx="7" fill="#142a41"/>
  <path d="M8 11.5 L13 16 L8 20.5"
        fill="none" stroke="#5ed476" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="16.5" y="18" width="8" height="3" rx="1.5" fill="#5ed476"/>
</svg>
