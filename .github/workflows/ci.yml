# CI for barrypre.com.
#
# Every gate lives in ./verify.sh, not here. This workflow installs the tools it
# needs and runs it, so a green run locally means the same thing as a green run
# here. The reasoning behind each gate is beside it in verify.sh.
#
# verify.sh exits 2 when a check could not run. Here that fails the build like
# any other non-zero exit: a check that did not run has not passed. There is no
# `continue-on-error` or `|| true` anywhere in this file.
#
# The Go version is pinned exactly and appears in three places: here, the `go`
# directive in go.mod, and the builder image in the Dockerfile. The floor is
# 1.26.11 because govulncheck reports 13 reachable standard-library
# vulnerabilities in 1.25.13, in crypto/tls, crypto/x509, html/template,
# mime/multipart and net/http, fixed only in 1.26.9 and 1.26.10: Go 1.25 is
# out of support and gets no more security releases.
# Raise all three together; a mismatch means CI is not testing what ships.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.26.11"

jobs:
  verify:
    name: verify.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          # No go.sum (no dependencies), so there is nothing to key a cache on.
          cache: false

      # Pinned, not @latest: with a floating version a gate's own verdict can
      # change without a commit to this repository.
      - name: Install the tools verify.sh needs
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0

      - name: verify.sh
        run: sh verify.sh
